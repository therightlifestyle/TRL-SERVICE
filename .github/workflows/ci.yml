name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # The build requires a canonical origin and has no default (D-021). CI builds a
  # throwaway artifact for testing, so it uses a reserved, non-resolvable origin:
  # a real-looking host here would be a claim about infrastructure, and `.invalid`
  # is the domain RFC 2606 guarantees can never exist. Tests derive the origin from
  # the artifact rather than assuming this value.
  PUBLIC_SITE_URL: https://ci.invalid
  # Indexing stays in the default (off) state, which is what the first deployment
  # ships with, so the crawl policy asserted in CI is the one that goes live first.
  PUBLIC_ALLOW_INDEXING: 'false'

jobs:
  verify:
    name: Typecheck, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` installs exactly the committed lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Deployment preflight
        run: npm run preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests and static accessibility checks
        run: npm run test:unit

      # Proves the deployable artifact is valid before anyone tries to deploy it,
      # and needs no credentials or account: it resolves the adapter's generated
      # config (dist/server/wrangler.json), checks the bindings, and stops short
      # of uploading.
      - name: Validate the deploy artifact
        run: npx wrangler deploy --dry-run

  e2e:
    name: End-to-end and browser accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # Production dependencies are the ones that reach a visitor's browser or
      # the build output, so a high-severity advisory there fails the run.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory only)
        run: npm audit --audit-level=moderate || true
